<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Helvetica, Arial, sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="760" height="420" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Robotic Arm Wiring</text>

  <!-- Laptop -->
  <rect x="30" y="70" width="140" height="60" rx="6" fill="#eef2f7" stroke="#445"/>
  <text x="100" y="97" text-anchor="middle" fill="#222">Laptop</text>
  <text x="100" y="115" text-anchor="middle" font-size="12" fill="#555">USB (power + serial)</text>
  <line x1="170" y1="100" x2="250" y2="100" stroke="#445" stroke-width="2"/>

  <!-- ESP32 -->
  <rect x="250" y="60" width="170" height="250" rx="8" fill="#e8f4ec" stroke="#2d6a3e" stroke-width="2"/>
  <text x="335" y="88" text-anchor="middle" font-weight="bold" fill="#1d4a2a">ESP32</text>
  <text x="335" y="106" text-anchor="middle" font-size="12" fill="#2d6a3e">Bluetooth: "Gripper"</text>
  <text x="410" y="158" text-anchor="end" fill="#222">GPIO 13</text>
  <text x="410" y="208" text-anchor="end" fill="#222">GPIO 12</text>
  <text x="410" y="258" text-anchor="end" fill="#222">GPIO 14</text>
  <text x="410" y="298" text-anchor="end" fill="#222">GND</text>

  <!-- Servos -->
  <g>
    <rect x="560" y="130" width="170" height="44" rx="6" fill="#fdf1e3" stroke="#a5652a"/>
    <text x="645" y="157" text-anchor="middle" fill="#222">Left arm servo</text>
    <rect x="560" y="180" width="170" height="44" rx="6" fill="#fdf1e3" stroke="#a5652a"/>
    <text x="645" y="207" text-anchor="middle" fill="#222">Right arm servo</text>
    <rect x="560" y="230" width="170" height="44" rx="6" fill="#fdf1e3" stroke="#a5652a"/>
    <text x="645" y="257" text-anchor="middle" fill="#222">Gripper servo</text>
  </g>

  <!-- Signal lines -->
  <g stroke="#d4a017" stroke-width="2.5">
    <line x1="420" y1="153" x2="560" y2="153"/>
    <line x1="420" y1="203" x2="560" y2="203"/>
    <line x1="420" y1="253" x2="560" y2="253"/>
  </g>
  <text x="490" y="145" text-anchor="middle" font-size="11" fill="#8a6a00">PWM 50 Hz</text>

  <!-- External supply -->
  <rect x="560" y="330" width="170" height="60" rx="6" fill="#fbe9e9" stroke="#a33"/>
  <text x="645" y="356" text-anchor="middle" fill="#222">External servo</text>
  <text x="645" y="374" text-anchor="middle" fill="#222">power supply</text>

  <!-- V+ to servos -->
  <line x1="740" y1="350" x2="740" y2="152" stroke="#c22" stroke-width="2.5"/>
  <line x1="730" y1="152" x2="740" y2="152" stroke="#c22" stroke-width="2.5"/>
  <line x1="730" y1="202" x2="740" y2="202" stroke="#c22" stroke-width="2.5"/>
  <line x1="730" y1="252" x2="740" y2="252" stroke="#c22" stroke-width="2.5"/>
  <line x1="730" y1="350" x2="740" y2="350" stroke="#c22" stroke-width="2.5"/>
  <text x="748" y="300" font-size="12" fill="#c22" transform="rotate(90 748 300)">V+</text>

  <!-- Common ground -->
  <line x1="420" y1="293" x2="500" y2="293" stroke="#222" stroke-width="2.5"/>
  <line x1="500" y1="293" x2="500" y2="372" stroke="#222" stroke-width="2.5"/>
  <line x1="500" y1="372" x2="560" y2="372" stroke="#222" stroke-width="2.5"/>
  <text x="508" y="340" font-size="12" fill="#222">common GND</text>

  <text x="30" y="405" font-size="12" fill="#555">Servos are powered from the external supply, not from the ESP32/USB. That change fixed Bluetooth drop-outs and erratic servo motion.</text>
</svg>
